# Negative fixture: expose[].viaBalancer list must name at least one
# balancer (structural: `string | [_, ...string]`).
apiVersion: topology.amispec.io/v1
kind: TopologyBlueprint
metadata:
  projectId: demo-blog
  organization: example-org
clusters:
  - id: local
    name: Demo Cluster
    domain: example.local
    security:
      sopsRecipients:
        - age1examplepublickey00000000000000000000000000000000000000
    cni:
      engine: cilium-ebpf
      clusterMeshId: 1
      kubeProxyReplacement: true
    nodes:
      - id: node-1
        role: control-plane-worker
        pricingTier: standard-node
        hardware:
          cpuCores: 2
          memoryMb: 4096
          disks:
            - { name: nvme0n1, tier: nvme-local, sizeGb: 50 }
    loadBalancers:
      - { id: main-l7, layer: l7-gateway, provider: cilium-envoy, vipReachability: l2-announce }
    components:
      - id: web
        passport: stateless-app
        version: "1.0.0"
        passportRev: 1
        topology: { mode: standalone }
        resources: { cpuCores: 1, memoryMb: 256 }
        expose:
          - { endpoint: web, viaBalancer: [], scope: public, hostname: "example.local" }
